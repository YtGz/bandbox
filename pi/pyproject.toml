[project]
name = "bandbox-pi"
version = "0.1.0"
description = "BandBox recording uploader for Raspberry Pi Zero 2 W"
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "numpy",
    # waveshare-epd's RaspberryPi backend uses gpiozero + spidev (not RPi.GPIO).
    # lgpio is gpiozero's modern pin factory — it talks to the kernel
    # gpio-cdev (/dev/gpiochipN) instead of mmap'ing /dev/gpiomem the way
    # RPi.GPIO does. RPi.GPIO has been unmaintained since 2019, doesn't work
    # on the Pi 5, and is flaky on aarch64 kernels in general.
    "gpiozero",
    "lgpio",
    "spidev",
    "waveshare-epd @ git+https://github.com/waveshareteam/e-Paper.git#subdirectory=RaspberryPi_JetsonNano/python",
]

[tool.uv]
package = false

# waveshare-epd's setup.py picks between RPi.GPIO and Jetson.GPIO based on a
# sysfs path (/sys/bus/platform/drivers/gpiomem-bcm2835) that no longer exists
# on modern Pi kernels, so it falls through and pulls in Jetson.GPIO. The
# actual waveshare code always does `import RPi.GPIO`, so Jetson.GPIO is dead
# weight. Drop it from the resolved set.
override-dependencies = [
    "jetson-gpio ; sys_platform == 'never'",
]
